<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - EJIC Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; }
        .neon-card { 
            background-color: #111827; 
            border: 1px solid rgba(56, 189, 248, 0.2); 
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.08); 
        }
        .neon-input { 
            background-color: #1f2937; 
            border: 1px solid #374151; 
            color: #ffffff; 
            transition: all 0.2s ease;
        }
        .neon-input:focus { 
            border-color: #38bdf8; 
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); 
            outline: none; 
        }
        .neon-btn { 
            background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%); 
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); 
            transition: all 0.3s ease; 
        }
        .neon-btn:hover { 
            box-shadow: 0 0 25px rgba(14, 165, 233, 0.7); 
            transform: translateY(-1px); 
        }
        .neon-title { text-shadow: 0 0 12px rgba(56, 189, 248, 0.5); }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-sky-400 neon-title">📦 EJIC Studio</h1>
            <p class="text-xs text-slate-400 mt-1">Gestión de Stock en la Nube</p>
        </div>

        <section class="neon-card p-8 rounded-2xl">
            <h2 class="text-xl font-semibold text-white mb-1">Bienvenido de nuevo</h2>
            <p class="text-sm text-slate-400 mb-6">Ingresa tus credenciales para acceder al panel</p>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label for="usuario" class="block text-sm font-medium text-slate-400">Usuario</label>
                    <input 
                        type="text" 
                        id="usuario" 
                        placeholder="admin" 
                        required 
                        class="w-full mt-1.5 p-2.5 rounded-lg neon-input text-sm"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-400">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="••••••••" 
                        required 
                        class="w-full mt-1.5 p-2.5 rounded-lg neon-input text-sm"
                    >
                </div>

                <button type="submit" id="btnLogin" class="w-full text-white py-2.5 rounded-lg font-semibold neon-btn text-sm">
                    Iniciar Sesión
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
                <a href="index.html" class="hover:text-sky-400 transition flex items-center gap-1">
                    <span>←</span> Volver al Inicio
                </a>
                <a href="inventario.html" class="hover:text-sky-400 transition">
                    Ir al Inventario
                </a>
            </div>
        </section>

        <p class="text-center text-xs text-slate-600 mt-6">
            Traductores e Intérpretes II
        </p>
    </div>

    <script src="app.js"></script>
</body>
</html>
