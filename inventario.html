<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Panel Neón</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; }
        .neon-card { background-color: #111827; border: 1px solid rgba(56, 189, 248, 0.2); box-shadow: 0 0 15px rgba(56, 189, 248, 0.05); }
        .neon-input { background-color: #1f2937; border: 1px solid #374151; color: #ffffff; }
        .neon-input:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); outline: none; }
        .neon-btn { background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%); box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); transition: all 0.3s ease; }
        .neon-btn:hover { box-shadow: 0 0 25px rgba(14, 165, 233, 0.7); transform: translateY(-1px); }
        .neon-title { text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        .sidebar { background-color: #0f172a; border-right: 1px solid rgba(56, 189, 248, 0.15); }
    </style>
</head>

<!-- min-h-screen + flex + flex-col + md:flex-row: Estructura adaptable (columna en móvil, fila con barra lateral en PC) -->
<body class="min-h-screen flex flex-col md:flex-row">

    <!-- Menú Lateral -->
    <aside class="sidebar w-full md:w-64 p-5 flex flex-col justify-between shrink-0">
        <div>
            <div class="flex items-center justify-between mb-8">
                <h1 class="text-base font-bold text-sky-400">📦 EJIC Studio</h1>
                <a href="login.html" class="md:hidden text-xs bg-sky-500/10 text-sky-300 border border-sky-500/30 px-2.5 py-1 rounded-lg">Login</a>
            </div>
            <nav class="space-y-2 text-sm">
                <a href="index.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition">
                    <span>🏠</span> <span>Inicio</span>
                </a>
                <a href="inventario.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-sky-500/10 text-sky-400 border border-sky-500/20 font-medium">
                    <span>📦</span> <span>Inventario</span>
                </a>
            </nav>
        </div>
        <div class="hidden md:block pt-4 border-t border-slate-800 text-xs text-slate-500">
            Traductores e Intérpretes II
        </div>
    </aside>

    <!-- Contenedor Principal del Panel -->
    <div class="flex-1 flex flex-col min-h-screen">
        <header class="bg-slate-900/60 border-b border-sky-500/10 p-4 flex justify-between items-center">
            <span class="text-xs text-slate-400">Gestión de Stock en la Nube</span>
            <a href="login.html" class="hidden md:inline-block text-xs bg-sky-500/10 text-sky-300 border border-sky-500/30 px-3 py-1.5 rounded-lg hover:bg-sky-500/20 transition">
                Iniciar Sesión
            </a>
        </header>

        <!-- 
          GRID ADAPTABLE:
          - grid-cols-1: En celulares, muestra las secciones una debajo de otra (1 columna).
          - lg:grid-cols-3: En pantallas grandes (lg), divide el espacio en 3 columnas (1 para el formulario, 2 para la tabla).
        -->
        <main class="flex-1 p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Columna del Formulario (Ocupa 1 espacio en pantallas grandes con lg:col-span-1) -->
            <section class="neon-card p-6 rounded-xl lg:col-span-1 h-fit">
                <h2 class="text-lg font-semibold mb-4 text-sky-400">Nuevo Producto</h2>
                <form id="productForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-400">Nombre del Producto</label>
                        <input type="text" id="nombre" required class="w-full mt-1 p-2 rounded-lg neon-input">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400">Cantidad</label>
                        <input type="number" id="cantidad" required class="w-full mt-1 p-2 rounded-lg neon-input">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400">Precio (L)</label>
                        <input type="number" step="0.01" id="precio" required class="w-full mt-1 p-2 rounded-lg neon-input">
                    </div>
                    <button type="submit" class="w-full text-white p-2 rounded-lg font-semibold neon-btn">
                        Guardar Producto
                    </button>
                </form>
            </section>

            <!-- Columna de la Tabla (Ocupa 2 espacios en pantallas grandes con lg:col-span-2) -->
            <!-- overflow-x-auto permite que si la pantalla es muy pequeña, la tabla se pueda deslizar horizontalmente sin romper el diseño -->
            <section class="neon-card p-6 rounded-xl lg:col-span-2 overflow-x-auto">
                <h2 class="text-lg font-semibold mb-4 text-sky-400">Inventario Actual</h2>
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-sm">
                            <th class="pb-2">Producto</th>
                            <th class="pb-2">Cantidad</th>
                            <th class="pb-2">Precio</th>
                            <th class="pb-2 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody" class="divide-y divide-slate-800/60 text-sm">
                        <tr>
                            <td colspan="4" class="py-4 text-center text-slate-500">Cargando inventario desde Supabase...</td>
                        </tr>
                    </tbody>
                </table>
            </section>

        </main>
    </div>

    <!-- Archivo JavaScript externo -->
    <script src="app.js"></script>
</body>
</html>
