<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Boutique Los Ing's</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4 antialiased selection:bg-pink-500/30 selection:text-pink-200">

    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-pink-500/25 to-violet-500/25 border border-pink-400/35 shadow-lg shadow-pink-500/15 mb-3">
                <span class="text-2xl">👗</span>
            </a>
            <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-300 via-fuchsia-400 to-violet-400 neon-title">
                Boutique Los Ing's
            </h1>
            <p class="text-xs text-slate-400 mt-1">Gestión de Prendas y Equipo de Trabajo</p>
        </div>

        <section class="neon-card p-8 rounded-2xl">
            <div class="mb-6">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <span>🧥</span> Acceso a la Boutique
                </h2>
                <p class="text-xs text-slate-400 mt-1">Ingresa tus credenciales para gestionar el catálogo de ropa y el personal</p>
            </div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label for="usuario" class="block text-xs font-semibold uppercase tracking-wider text-pink-200/80 mb-1.5">
                        Usuario del Asesor / Admin
                    </label>
                    <input 
                        type="text" 
                        id="usuario" 
                        placeholder="admin" 
                        required 
                        class="w-full p-2.5 rounded-xl neon-input text-sm"
                    >
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-pink-200/80 mb-1.5">
                        Contraseña
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="••••••••" 
                        required 
                        class="w-full p-2.5 rounded-xl neon-input text-sm"
                    >
                </div>

                <button type="submit" id="btnLogin" class="w-full text-white py-2.5 rounded-xl font-semibold neon-btn text-sm flex items-center justify-center gap-2">
                    <span>👠</span>
                    <span>Entrar al Panel de la Boutique</span>
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
                <a href="index.html" class="hover:text-pink-400 transition flex items-center gap-1.5 font-medium">
                    <span>←</span> Volver al Inicio
                </a>
                <a href="inventario.html" class="hover:text-fuchsia-400 transition font-medium">
                    Ir al Catálogo de Prendas →
                </a>
            </div>
        </section>

        <p class="text-center text-xs text-slate-500 mt-6">
            Boutique Los Ing's • Moda & Estilo en la Nube
        </p>
    </div>

    <script src="app.js"></script>
</body>
</html>
